version: "3"

vars:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GCI_VERSION: "v0.14.0"
  GOFUMPT_VERSION: "v0.10.0"

  BIN_DIR: '{{.ROOT_DIR | replace "\\" "/"}}/bin'
  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint{{.EXE_EXT}}"
  GCI: "{{.BIN_DIR}}/gci{{.EXE_EXT}}"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt{{.EXE_EXT}}"

  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  DEMO_DIR: "examples/demo/stand"
  DEMO_COMPOSE: "docker compose -f examples/demo/stand/compose.yaml"

  LDFLAGS: >-
    -s -w
    -X github.com/RomanAgaltsev/gantry/internal/cli.Version={{.VERSION}}

tasks:
  default:
    desc: list available tasks
    cmds:
      - task --list
    silent: true

  formatters:install:
    desc: install gofumpt and gci
    cmds:
      - "GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}"
      - "GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}"
    status:
      - ls {{.GOFUMPT}} >/dev/null 2>&1
      - ls {{.GCI}} >/dev/null 2>&1

  golangci-lint:install:
    desc: install golangci-lint
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - ls {{.GOLANGCI_LINT}} >/dev/null 2>&1

  setup:
    desc: install all dev tools
    deps: [formatters:install, golangci-lint:install]

  format:
    desc: format code (gofumpt + gci)
    deps: [formatters:install]
    cmds:
      - bash -c "find . -type f -name '*.go' -exec {{.GOFUMPT}} -extra -w {} +"
      - bash -c "find . -type f -name '*.go' -exec {{.GCI}} write -s standard -s default -s 'prefix(github.com/RomanAgaltsev/gantry)' {} +"

  lint:
    desc: run golangci-lint
    deps: [golangci-lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run --allow-parallel-runners ./... --config=.golangci.yml"

  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...

  test:
    desc: race + shuffled tests
    cmds:
      - go test -race -shuffle=on ./...

  fuzz:
    desc: short fuzz smoke of the parsers
    cmds:
      - go test ./internal/pin/ -run x -fuzz FuzzRead -fuzztime 20s
      - go test ./internal/forge/ -run x -fuzz FuzzParseMetadata -fuzztime 20s
      - go test ./internal/verify/ -run x -fuzz FuzzParseComposePS -fuzztime 20s
      - go test ./internal/executor/composessh/ -run x -fuzz FuzzShellQuote -fuzztime 20s

  cover:
    desc: coverage profile
    cmds:
      - go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

  deps:update:
    desc: tidy modules
    cmds:
      - go mod tidy -compat={{.GO_VERSION}}

  build:
    desc: build gantry into ./bin
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o {{.BIN_DIR}}/gantry{{.EXE_EXT}} ./cmd/gantry

  ci:
    desc: full local gate (what CI runs)
    cmds:
      - task: deps:update
      - task: vet
      - task: lint
      - task: test

  # --- demo stand -------------------------------------------------------------
  # A manual stand for examples/demo/gantry.yaml. Nothing here runs in `task ci`:
  # it asserts nothing and is driven by hand. See examples/demo/README.md.

  demo:setup:
    desc: generate the demo stand's keys, certificate, known_hosts and scratch tree
    cmds:
      - sh {{.DEMO_DIR}}/setup.sh

  demo:up:
    desc: bring the demo stand up
    cmds:
      - task: demo:setup
      - "{{.DEMO_COMPOSE}} --profile cli build"
      - "{{.DEMO_COMPOSE}} up -d"

  demo:down:
    desc: tear the demo stand down, including its volumes
    cmds:
      - "{{.DEMO_COMPOSE}} --profile cli down -v"

  demo:reset:
    desc: tear the stand down and bring it back up, discarding published releases
    cmds:
      - task: demo:down
      - task: demo:up

  demo:logs:
    desc: follow the demo stand's logs
    cmds:
      - "{{.DEMO_COMPOSE}} logs -f"

  demo:host:
    desc: open a shell on the demo app-host
    cmds:
      - "{{.DEMO_COMPOSE}} exec app-host sh"

  demo:gantry:
    desc: 'run gantry against the stand: task demo:gantry -- plan --env test'
    cmds:
      # `run --rm`, not `exec`: the shipped image is distroless with no shell, so
      # there is nothing to exec into and no session to hold.
      - "{{.DEMO_COMPOSE}} run --rm gantry {{.CLI_ARGS}}"

  demo:release:
    desc: 'publish a release to the fake forge: task demo:release -- <component> <version> [image_repository] [image_tag] [built_at]'
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        comp="$1"; ver="$2"; repo="${3:-traefik/whoami}"; tag="${4:-v$2}"; built="$5"
        if [ -z "$comp" ] || [ -z "$ver" ]; then
          echo 'usage: task demo:release -- <component> <version> [image_repository] [image_tag] [built_at]' >&2
          exit 2
        fi
        # built_at is RFC3339 and optional, defaulting to now in the forge. It is
        # settable because the drift scenario needs a release dated past the 7d
        # threshold, and there is no other way to produce one.
        body="{\"project\":\"demo/$comp\",\"version\":\"$ver\",\"image_repository\":\"$repo\",\"image_tag\":\"$tag\""
        if [ -n "$built" ]; then body="$body,\"built_at\":\"$built\""; fi
        body="$body}"
        # --ssl-no-revoke is load-bearing on Windows: the curl Git Bash ships is
        # Schannel-backed, and Schannel cannot check revocation for the demo CA
        # (a local CA publishes no CRL or OCSP URL), so it rejects the chain with
        # exit 60. The flag is a no-op on OpenSSL-backed curl.
        curl -sS --fail-with-body \
          --cacert {{.DEMO_DIR}}/secrets/demo-ca.crt \
          --ssl-no-revoke \
          --resolve gitlab.example.com:18443:127.0.0.1 \
          -H 'Content-Type: application/json' \
          -d "$body" \
          https://gitlab.example.com:18443/_control/release
        echo
