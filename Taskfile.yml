version: "3"

vars:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GCI_VERSION: "v0.14.0"
  GOFUMPT_VERSION: "v0.10.0"

  BIN_DIR: '{{.ROOT_DIR | replace "\\" "/"}}/bin'
  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint{{.EXE_EXT}}"
  GCI: "{{.BIN_DIR}}/gci{{.EXE_EXT}}"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt{{.EXE_EXT}}"

  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: >-
    -s -w
    -X github.com/RomanAgaltsev/gantry/internal/cli.Version={{.VERSION}}


  # -race needs cgo, and cgo needs a C toolchain -- which this workstation has no
  # gcc for, so the native race tasks cannot even build here. The :docker tasks
  # run the identical gate in a Linux container, which is also the platform CI
  # runs on. `task toolchain:check` reports which of them you can use.
  GO_IMAGE: "golang:1.26"
  DOCKER_RUN: >-
    docker run --rm
    -v "{{.ROOT_DIR | replace "\\" "/"}}:/src"
    -v go-race-modcache:/go/pkg/mod
    -v go-race-buildcache:/root/.cache/go-build
    -w /src {{.GO_IMAGE}}

tasks:
  default:
    desc: list available tasks
    cmds:
      - task --list
    silent: true

  formatters:install:
    desc: install gofumpt and gci
    cmds:
      - "GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}"
      - "GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}"
    status:
      - ls {{.GOFUMPT}} >/dev/null 2>&1
      - ls {{.GCI}} >/dev/null 2>&1

  golangci-lint:install:
    desc: install golangci-lint
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - ls {{.GOLANGCI_LINT}} >/dev/null 2>&1

  setup:
    desc: install all dev tools
    deps: [formatters:install, golangci-lint:install]

  format:
    desc: format code (gofumpt + gci)
    deps: [formatters:install]
    cmds:
      - bash -c "find . -type f -name '*.go' -exec {{.GOFUMPT}} -extra -w {} +"
      - bash -c "find . -type f -name '*.go' -exec {{.GCI}} write -s standard -s default -s 'prefix(github.com/RomanAgaltsev/gantry)' {} +"

  lint:
    desc: run golangci-lint
    deps: [golangci-lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run --allow-parallel-runners ./... --config=.golangci.yml"

  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...

  test:
    desc: race + shuffled tests
    cmds:
      - go test -race -shuffle=on ./...

  fuzz:
    desc: short fuzz smoke of the parsers
    cmds:
      - go test ./internal/pin/ -run x -fuzz FuzzRead -fuzztime 20s
      - go test ./internal/forge/ -run x -fuzz FuzzParseMetadata -fuzztime 20s
      - go test ./internal/verify/ -run x -fuzz FuzzParseComposePS -fuzztime 20s
      - go test ./internal/executor/composessh/ -run x -fuzz FuzzShellQuote -fuzztime 20s

  cover:
    desc: coverage profile
    cmds:
      - go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

  deps:update:
    desc: tidy modules
    cmds:
      - go mod tidy -compat={{.GO_VERSION}}

  build:
    desc: build gantry into ./bin
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o {{.BIN_DIR}}/gantry{{.EXE_EXT}} ./cmd/gantry

  ci:
    desc: full local gate (what CI runs)
    cmds:
      - task: deps:update
      - task: vet
      - task: lint
      - task: test

  test:docker:
    desc: race + shuffled tests in a Linux container (no local C toolchain needed)
    cmds:
      - "{{.DOCKER_RUN}} go test -race -shuffle=on ./..."

  test:norace:
    desc: shuffled tests WITHOUT the race detector -- a partial gate
    cmds:
      - echo "WARNING -- running without -race. This does NOT satisfy the gate."
      - go test -shuffle=on ./...

  toolchain:check:
    desc: report which of test / test:docker / test:norace can run here
    silent: true
    cmds:
      - if command -v gcc >/dev/null 2>&1; then echo "C toolchain -- $(gcc --version | head -1)"; else echo "C toolchain -- none; 'task test' cannot build, use 'task test:docker'"; fi
      - if docker version >/dev/null 2>&1; then echo "docker -- available"; else echo "docker -- none; only 'task test:norace' is left, and it does NOT satisfy the gate"; fi

  cover:docker:
    desc: coverage profile, in a Linux container
    cmds:
      - "{{.DOCKER_RUN}} go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./..."

  ci:docker:
    desc: the ci gate with the race step in a container, for machines with no C toolchain
    cmds:
      - task: deps:update
      - task: vet
      - task: lint
      - task: test:docker
